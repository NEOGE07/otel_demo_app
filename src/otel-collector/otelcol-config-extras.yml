
# ============================================================
# EXPORTERS
# ============================================================

exporters:

  # Primary observability backend: Elasticsearch
  elasticsearch:
    endpoint: http://elasticsearch:9200
    timeout: 30s

    sending_queue:
      enabled: true
      num_consumers: 10
      queue_size: 1000

    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 300s

  # Jaeger trace exporter
  otlp_grpc/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

    sending_queue:
      enabled: true

  # Prometheus metrics exporter
  otlp_http/prometheus:
    endpoint: http://prometheus:9090/api/v1/otlp
    tls:
      insecure: true

  # OpenSearch log exporter
  opensearch:
    logs_index: otel-logs
    logs_index_time_format: "yyyy-MM-dd"

    http:
      endpoint: http://opensearch:9200
      tls:
        insecure: true


# ============================================================
# PROCESSORS
# ============================================================

processors:

  # Memory protection
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25

  # Existing cumulative-to-delta processor
  # Only applies to histograms and exponential histograms.
  cumulative_to_delta:
    include:
      metric_types:
        - histogram
        - exponentialhistogram

  # Delta-to-cumulative processor
  # Accumulates incoming delta Sum metrics in memory.
  # State is lost when the Collector restarts.
  deltatocumulative:
    max_stale: 87600h
    max_streams: 100

  # Copy service.name from resource attributes
  # into metric datapoint attributes.
  transform/add_service_name_to_metrics:
    metric_statements:
      - context: datapoint
        statements:
          - set(attributes["service.name"], resource.attributes["service.name"]) where resource.attributes["service.name"] != nil

      - context: resource
        statements:
          - delete_key(attributes, "service.name")


# ============================================================
# CONNECTORS
# ============================================================

connectors:

  # ==========================================================
  # 1. AGGREGATE HTTP REQUEST METRICS (FROM LOGS)
  # ==========================================================

  signal_to_metrics/aggregate:
    error_mode: ignore

    logs:

      # Successful HTTP requests
      - name: http.requests.successful
        description: Total successful HTTP requests
        unit: "{request}"

        conditions:
          - 'log.attributes["http.response.status_code"] != nil and log.attributes["http.response.status_code"] < 400'

        #include_resource_attributes:
        #  - key: host.name

        sum:
          value: "1"
          monotonic: true

      # Failed HTTP requests
      - name: http.requests.failed
        description: Total failed HTTP requests
        unit: "{request}"

        conditions:
          - 'log.attributes["http.response.status_code"] != nil and log.attributes["http.response.status_code"] >= 400'

        #include_resource_attributes:
        #  - key: host.name

        sum:
          value: "1"
          monotonic: true


  # ==========================================================
  # 2. DETAILED HTTP REQUEST METRICS (FROM LOGS)
  # ==========================================================

  signal_to_metrics/detailed:
    error_mode: ignore

    logs:

      - name: app.http.requests
        description: Count HTTP requests by service, URL path and status code
        unit: "{request}"

        conditions:
          - 'log.attributes["http.response.status_code"] != nil and resource.attributes["service.name"] != nil'

        attributes:
          - key: url.path

          - key: http.response.status_code

          - key: app.operation
            optional: true

        #include_resource_attributes:
        #  - key: service.name

        sum:
          value: "1"
          monotonic: true


  # ==========================================================
  # 3. HTTP TRACE-TO-METRICS CONVERSION
  # ==========================================================
  #
  # Input: Individual spans
  #
  # Output metric:
  #   app.http.trace.requests
  #
  # Metric dimensions:
  #   - http.response.status_code
  #   - http.request.method (optional)
  #
  # Each span contributes its adjusted count.
  # Output temporality: DELTA
  # ==========================================================

  signal_to_metrics/traces:
    error_mode: ignore

    spans:

      - name: app.http.trace.requests
        description: Count HTTP requests by response status code and method
        unit: "{request}"

        # Only process spans containing an HTTP response status code.
        conditions:
          - 'span.attributes["http.response.status_code"] != nil'

        # Categorise metrics by HTTP status code and method.
        attributes:
          - key: http.response.status_code

          - key: http.request.method
            optional: true

        # Generate a monotonic Sum metric.
        sum:
          value: "Int(AdjustedCount())"
          monotonic: true


# ============================================================
# SERVICE PIPELINES
# ============================================================

service:

  pipelines:

    # ========================================================
    # TRACES PIPELINE
    # ========================================================

    traces:
      receivers:
        - otlp

      processors:
        - resource_detection
        - memory_limiter
        - transform/sanitize_spans
        - gen_ai_normalizer
        - transform/redact_sensitive_data
        - redaction

      exporters:
        - debug
        - otlp_grpc/jaeger
        - span_metrics
        - signal_to_metrics/traces
        - elasticsearch


    # ========================================================
    # ORIGINAL METRICS PIPELINE
    # PROMETHEUS
    # ========================================================

    metrics:
      receivers:
        - docker_stats
        - http_check/frontend-proxy
        - host_metrics
        - nginx
        - otlp
        - redis
        - postgresql
        - prometheus/ad
        - span_metrics
        - signal_to_metrics/traces

      processors:
        - resource_detection
        - memory_limiter
        - transform/add_service_name_to_metrics

      exporters:
        - debug
        - otlp_http/prometheus


    # ========================================================
    # ORIGINAL METRICS PIPELINE
    # ELASTICSEARCH
    # ========================================================

    metrics/elasticsearch:
      receivers:
        - docker_stats
        - http_check/frontend-proxy
        - host_metrics
        - nginx
        - otlp
        - redis
        - postgresql
        - prometheus/ad
        - span_metrics
        - signal_to_metrics/traces

      processors:
        - resource_detection
        - memory_limiter
        - cumulative_to_delta
        - transform/add_service_name_to_metrics

      exporters:
        - elasticsearch


    # ========================================================
    # CUMULATIVE LOG-DERIVED METRICS
    # ========================================================

    metrics/log-derived:
      receivers:
        - signal_to_metrics/aggregate

      processors:
        - resource_detection
        - memory_limiter
        - deltatocumulative

      exporters:
        - debug
        - otlp_http/prometheus
        - elasticsearch


    # ========================================================
    # DETAILED LOG-DERIVED METRICS
    # ========================================================

    metrics/log-derived/detailed:
      receivers:
        - signal_to_metrics/detailed

      processors:
        - resource_detection
        - memory_limiter
        - transform/add_service_name_to_metrics

      exporters:
        - debug
        - otlp_http/prometheus
        - elasticsearch


    # ========================================================
    # LOGS PIPELINE
    # ========================================================

    logs:
      receivers:
        - otlp
        - postgresql

      processors:
        - resource_detection
        - memory_limiter
        - transform/sanitize_logs

      exporters:
        - debug
        - opensearch
        - elasticsearch
        - signal_to_metrics/aggregate
        - signal_to_metrics/detailed


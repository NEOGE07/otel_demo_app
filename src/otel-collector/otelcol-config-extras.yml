
# ============================================================
# EXPORTERS
# ============================================================

exporters:
  # Elasticsearch
  elasticsearch:
    endpoint: http://elasticsearch:9200

  # Jaeger
  otlp_grpc/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
    sending_queue:
      batch: {}

  # Prometheus OTLP HTTP receiver
  otlp_http/prometheus:
    endpoint: http://prometheus:9090/api/v1/otlp
    tls:
      insecure: true
    sending_queue:
      batch: {}

  # OpenSearch logs
  opensearch:
    logs_index: otel-logs
    logs_index_time_format: "yyyy-MM-dd"
    http:
      endpoint: http://opensearch:9200
      tls:
        insecure: true
    sending_queue:
      batch: {}


# ============================================================
# PROCESSORS
# ============================================================

processors:
  # Converts delta-temporality metrics into cumulative metrics.
  # This processor is used only in the log-derived metrics
  # pipeline defined below.
  delta_to_cumulative:
    max_stale: 5m


# ============================================================
# CONNECTORS
# ============================================================

connectors:
  signal_to_metrics:
    error_mode: ignore

    logs:
      - name: app.http.requests
        description: "Count HTTP requests by status code, user and operation"
        unit: "{request}"

        conditions:
          - 'log.attributes["http.response.status_code"] != nil'

        attributes:
          - key: http.response.status_code

          - key: user.id
            optional: true

          - key: app.operation
            optional: true

        sum:
          value: "1"
          monotonic: true


# ============================================================
# SERVICE PIPELINES
# ============================================================

service:
  pipelines:

    # --------------------------------------------------------
    # TRACES
    # --------------------------------------------------------

    traces:
      receivers:
        - otlp

      processors:
        - resource_detection
        - memory_limiter
        - transform/sanitize_spans
        - gen_ai_normalizer
        - transform/redact_sensitive_data
        - redaction

      exporters:
        - debug
        - otlp_grpc/jaeger
        - span_metrics
        - elasticsearch


    # --------------------------------------------------------
    # EXISTING METRICS
    # --------------------------------------------------------

    metrics:
      receivers:
        - docker_stats
        - http_check/frontend-proxy
        - host_metrics
        - nginx
        - otlp
        - redis
        - postgresql
        - prometheus/ad
        - span_metrics

      processors:
        - resource_detection
        - memory_limiter

      exporters:
        - debug
        - otlp_http/prometheus
        - elasticsearch


    # --------------------------------------------------------
    # LOG-DERIVED METRICS
    # --------------------------------------------------------

    metrics/log-derived:
      receivers:
        - signal_to_metrics

      processors:
        - resource_detection
        - memory_limiter
        - delta_to_cumulative

      exporters:
        - debug
        - otlp_http/prometheus
        - elasticsearch


    # --------------------------------------------------------
    # LOGS
    # --------------------------------------------------------

    logs:
      receivers:
        - otlp
        - postgresql

      processors:
        - resource_detection
        - memory_limiter
        - transform/sanitize_logs

      exporters:
        - debug
        - opensearch
        - elasticsearch
        - signal_to_metrics


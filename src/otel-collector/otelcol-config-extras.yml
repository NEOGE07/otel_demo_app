exporters:
  elasticsearch:
    endpoint: http://elasticsearch:9200

  otlp_grpc/jaeger:
    endpoint: "jaeger:4317"
    tls:
      insecure: true
    sending_queue:
      batch:

  otlp_http/prometheus:
    endpoint: "http://prometheus:9090/api/v1/otlp"
    tls:
      insecure: true
    sending_queue:
      batch:

  opensearch:
    logs_index: otel-logs
    logs_index_time_format: "yyyy-MM-dd"
    http:
      endpoint: "http://opensearch:9200"
      tls:
        insecure: true
    sending_queue:
      batch:

service:
  pipelines:
    traces:
      exporters: [debug, otlp_grpc/jaeger, span_metrics, elasticsearch]
    metrics:
      exporters: [debug, otlp_http/prometheus, elasticsearch]
    logs:
      exporters: [debug, opensearch, elasticsearch]

# ============================================================
# EXPORTERS
# ============================================================

exporters:
  elasticsearch:
    endpoint: http://elasticsearch:9200

  otlp_grpc/jaeger:
    endpoint: "jaeger:4317"
    tls:
      insecure: true
    sending_queue:
      batch:

  otlp_http/prometheus:
    endpoint: "http://prometheus:9090/api/v1/otlp"
    tls:
      insecure: true
    sending_queue:
      batch:

  opensearch:
    logs_index: otel-logs
    logs_index_time_format: "yyyy-MM-dd"
    http:
      endpoint: "http://opensearch:9200"
      tls:
        insecure: true
    sending_queue:
      batch:

# ============================================================
# CONNECTORS
# ============================================================

connectors:
  signal_to_metrics:
    error_mode: ignore

    logs:
      # ------------------------------------------------------
      # METRIC 1: Count HTTP requests by status and context
      # ------------------------------------------------------

      - name: app.http.requests
        description: "Count HTTP requests by status code, user and operation"
        unit: "{request}"

        conditions:
          - 'log.attributes["http.response.status_code"] != nil'

        attributes:
          - key: http.response.status_code
          - key: user.id
            optional: true
          - key: app.operation
            optional: true

        sum:
          value: "1"
          monotonic: true

# ============================================================
# PIPELINES
# ============================================================

service:
  pipelines:

    # --------------------------------------------------------
    # TRACES
    # --------------------------------------------------------

    traces:
      exporters:
        - debug
        - otlp_grpc/jaeger
        - span_metrics
        - elasticsearch

    # --------------------------------------------------------
    # METRICS
    # --------------------------------------------------------

    metrics:
      receivers:
        - docker_stats
        - http_check/frontend-proxy
        - host_metrics
        - nginx
        - otlp
        - redis
        - postgresql
        - prometheus/ad
        - span_metrics
        - signal_to_metrics

      exporters:
        - debug
        - otlp_http/prometheus
        - elasticsearch

    # --------------------------------------------------------
    # LOGS
    # --------------------------------------------------------

    logs:
      exporters:
        - debug
        - opensearch
        - elasticsearch
        - signal_to_metrics



# ============================================================
# EXPORTERS
# ============================================================

exporters:

  # Primary observability backend
  elasticsearch:
    endpoint: http://elasticsearch:9200
    timeout: 30s

    sending_queue:
      enabled: true
      num_consumers: 10
      queue_size: 1000

    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 300s

  # Jaeger - secondary trace backend
  otlp_grpc/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
    sending_queue:
      enabled: true

  # Prometheus OTLP HTTP receiver
  otlp_http/prometheus:
    endpoint: http://prometheus:9090/api/v1/otlp
    tls:
      insecure: true

  # OpenSearch - optional secondary log backend
  opensearch:
    logs_index: otel-logs
    logs_index_time_format: "yyyy-MM-dd"
    http:
      endpoint: http://opensearch:9200
      tls:
        insecure: true


# ============================================================
# PROCESSORS
# ============================================================

processors:

  # Resource and memory management
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25

  # Convert cumulative metrics into delta metrics.
  # Required for Elasticsearch histogram compatibility.
  cumulativetodelta:
    max_staleness: 5m
    
  # Copy service.name from metric resource attributes
  # into metric datapoint attributes.
  transform/add_service_name_to_metrics:
    metric_statements:
      - context: datapoint
        statements:
          - set(attributes["service.name"], resource.attributes["service.name"]) where resource.attributes["service.name"] != nil
          
      # Remove service.name from resource attributes
      - context: resource
        statements:
          - delete_key(attributes, "service.name")    


# ============================================================
# CONNECTORS
# ============================================================

connectors:

  # ----------------------------------------------------------
  # LOGS -> METRICS
  # ----------------------------------------------------------

  signal_to_metrics:
    error_mode: ignore

    logs:
      - name: app.http.requests
        description: "Count HTTP requests by service and status code"
        unit: "{request}"

        # Specifies the conditions of logs to perform conversion
        conditions:
          - 'log.attributes["http.response.status_code"] != nil and resource.attributes["service.name"] != nil'


        # Specifies attributes to perform conversion on
        attributes:
          - key: http.response.status_code
          #- key: service.name
          
          
          - key: app.operation
            optional: true

        include_resource_attributes:
          - key: service.name

        sum:
          value: "1"
          monotonic: true


# ============================================================
# SERVICE PIPELINES
# ============================================================

service:
  pipelines:

    # --------------------------------------------------------
    # TRACES
    # --------------------------------------------------------

    traces:
      receivers:
        - otlp

      processors:
        - resource_detection
        - memory_limiter
        - transform/sanitize_spans
        - gen_ai_normalizer
        - transform/redact_sensitive_data
        - redaction

      exporters:
        - debug
        - otlp_grpc/jaeger
        - span_metrics
        - elasticsearch


    # --------------------------------------------------------
    # METRICS -> PROMETHEUS
    # Original metric temporality preserved
    # --------------------------------------------------------

    metrics:
      receivers:
        - docker_stats
        - http_check/frontend-proxy
        - host_metrics
        - nginx
        - otlp
        - redis
        - postgresql
        - prometheus/ad
        - span_metrics

      processors:
        - resource_detection
        - memory_limiter
        - transform/add_service_name_to_metrics


      exporters:
        - debug
        - otlp_http/prometheus


    # --------------------------------------------------------
    # METRICS -> ELASTICSEARCH
    # Cumulative -> Delta conversion
    # --------------------------------------------------------

    metrics/elasticsearch:
      receivers:
        - docker_stats
        - http_check/frontend-proxy
        - host_metrics
        - nginx
        - otlp
        - redis
        - postgresql
        - prometheus/ad
        - span_metrics

      processors:
        - resource_detection
        - memory_limiter
        - cumulativetodelta
        - transform/add_service_name_to_metrics


      exporters:
        - elasticsearch


    # --------------------------------------------------------
    # LOG-DERIVED METRICS -> PROMETHEUS
    # --------------------------------------------------------

    metrics/log-derived:
      receivers:
        - signal_to_metrics

      processors:
        - resource_detection
        - memory_limiter
        - transform/add_service_name_to_metrics

      exporters:
        - debug
        - otlp_http/prometheus


    # --------------------------------------------------------
    # LOG-DERIVED METRICS -> ELASTICSEARCH
    # --------------------------------------------------------

    metrics/log-derived/elasticsearch:
      receivers:
        - signal_to_metrics

      processors:
        - resource_detection
        - memory_limiter
        - cumulativetodelta
        - transform/add_service_name_to_metrics

      exporters:
        - elasticsearch


    # --------------------------------------------------------
    # LOGS
    # --------------------------------------------------------

    logs:
      receivers:
        - otlp
        - postgresql

      processors:
        - resource_detection
        - memory_limiter
        - transform/sanitize_logs

      exporters:
        - debug
        - opensearch
        - elasticsearch
        - signal_to_metrics


# ============================================================
# EXPORTERS
# ============================================================

exporters:

  # ==========================================================
  # EXISTING GENERAL ELASTICSEARCH EXPORTER
  # Used by metrics and existing log-derived metrics.
  # ==========================================================

  elasticsearch:
    endpoint: http://elasticsearch:9200
    timeout: 30s

    sending_queue:
      enabled: true
      num_consumers: 10
      queue_size: 1000

    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 300s


  # ==========================================================
  # BEFORE SAMPLING ELASTICSEARCH EXPORTER
  # Receives traces before tail_sampling.
  # ==========================================================

  elasticsearch/before:
    endpoint: http://elasticsearch:9200
    timeout: 30s

    traces_index: traces-before.otel-default

    sending_queue:
      enabled: true
      num_consumers: 10
      queue_size: 1000

    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 300s


  # ==========================================================
  # AFTER SAMPLING ELASTICSEARCH EXPORTER
  # Receives only traces retained by tail_sampling.
  # ==========================================================

  elasticsearch/after:
    endpoint: http://elasticsearch:9200
    timeout: 30s

    traces_index: traces-after.otel-default

    sending_queue:
      enabled: true
      num_consumers: 10
      queue_size: 1000

    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 300s


  # ==========================================================
  # ADAPTIVE SAMPLING ELASTICSEARCH EXPORTER
  # DISABLED FOR NOW
  # Intended to receive traces retained by adaptive sampling.
  # ==========================================================

  # elasticsearch/adaptive:
  #   endpoint: http://elasticsearch:9200
  #   timeout: 30s
  #
  #   traces_index: traces-adaptive.otel-default
  #
  #   sending_queue:
  #     enabled: true
  #     num_consumers: 10
  #     queue_size: 1000
  #
  #   retry_on_failure:
  #     enabled: true
  #     initial_interval: 1s
  #     max_interval: 30s
  #     max_elapsed_time: 300s


  # ==========================================================
  # JAEGER TRACE EXPORTER
  # ==========================================================

  otlp_grpc/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

    sending_queue:
      enabled: true


  # ==========================================================
  # PROMETHEUS METRICS EXPORTER
  # ==========================================================

  otlp_http/prometheus:
    endpoint: http://prometheus:9090/api/v1/otlp
    tls:
      insecure: true


  # ==========================================================
  # OPENSEARCH LOG EXPORTER
  # ==========================================================

  opensearch:
    logs_index: otel-logs
    logs_index_time_format: "yyyy-MM-dd"

    http:
      endpoint: http://opensearch:9200
      tls:
        insecure: true


# ============================================================
# PROCESSORS
# ============================================================

processors:

  # ==========================================================
  # MEMORY PROTECTION
  # ==========================================================

  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25


  # ==========================================================
  # TRADITIONAL TAIL-BASED SAMPLING
  # Only used by the AFTER sampling pipeline.
  # ==========================================================


  # https://www.elastic.co/docs/solutions/observability/apm/discover-traces
  # tidy up traditional version first. KIV adaptive version (could possibly use GCC)
  
  # Elastic has retention policy --> can split data 
  # E.g. before traces 3 days, after traces SOP 30 day
  
  tail_sampling:
    decision_wait: 10s

    num_traces: 10000

    expected_new_traces_per_sec: 100

    policies:

      # Policy 1: Retain all traces containing errors
      - name: keep-error-traces
        type: status_code
        status_code:
          status_codes:
            - ERROR

      # Policy 2: Retain traces exceeding 1 second
      - name: keep-slow-traces
        type: latency
        latency:
          threshold_ms: 1000

      # Policy 3: Retain approximately 10% of
      # traces that do not match the other policies
      - name: sample-normal-traces
        type: probabilistic
        probabilistic:
          sampling_percentage: 10


  # ==========================================================
  # ADAPTIVE TAIL SAMPLING
  # DISABLED FOR NOW
  # This processor is not available in Collector 0.160.0.
  # ==========================================================

  # adaptive_tail_sampling:
  #   trace_timeout: 30s
  #   decision_delay: 2s
  #
  #   num_traces: 10000
  #   span_limit: 10000
  #
  #   decision_cache:
  #     sampled_cache_size: 10000
  #     non_sampled_cache_size: 10000
  #
  #   rules:
  #
  #     # Rule 1: Retain traces containing errors
  #     - name: keep-errors
  #       conditions:
  #         - span.status.code == STATUS_CODE_ERROR
  #       sampler:
  #         type: always_sample
  #
  #     # Rule 2: Adaptively sample normal traces
  #     - name: adaptive-default
  #       sampler:
  #         type: adaptive_percentage
  #         goal_percentage: 10
  #
  #         fingerprint_attributes:
  #           - resource.attributes["service.name"]
  #           - span.attributes["http.route"]
  #
  #         adjustment_interval: 15s
  #         weight: 0.5
  #         max_keys: 500


  # ==========================================================
  # CUMULATIVE-TO-DELTA PROCESSOR (DISABLED FOR TESTING)
  # ==========================================================

  # cumulative_to_delta:
  #   include:
  #     metric_types:
  #       - histogram
  #       - exponentialhistogram


  # ==========================================================
  # DELTA-TO-CUMULATIVE PROCESSOR
  # ==========================================================

  deltatocumulative:
    max_stale: 87600h
    max_streams: 100


  # ==========================================================
  # COPY SERVICE.NAME FROM RESOURCE TO METRIC DATAPOINTS
  # ==========================================================

  transform/add_service_name_to_metrics:
    metric_statements:
      - context: datapoint
        statements:
          - set(attributes["service.name"], resource.attributes["service.name"]) where resource.attributes["service.name"] != nil

      - context: resource
        statements:
          - delete_key(attributes, "service.name")


# ============================================================
# CONNECTORS
# ============================================================

connectors:

  # ==========================================================
  # 1. AGGREGATE HTTP REQUEST METRICS (FROM LOGS)
  # ==========================================================

  signal_to_metrics/aggregate:
    error_mode: ignore

    logs:

      # Successful HTTP requests
      - name: http.requests.successful
        description: Total successful HTTP requests
        unit: "{request}"

        conditions:
          - 'log.attributes["http.response.status_code"] != nil and log.attributes["http.response.status_code"] < 400'
        
        attributes:
          - key: app.metric_source
            default_value: logs_aggregate_success

        sum:
          value: "1"
          monotonic: true

      # Failed HTTP requests
      - name: http.requests.failed
        description: Total failed HTTP requests
        unit: "{request}"

        conditions:
          - 'log.attributes["http.response.status_code"] != nil and log.attributes["http.response.status_code"] >= 400'

        attributes:
          - key: app.metric_source
            default_value: logs_aggregate_fail
        
        sum:
          value: "1"
          monotonic: true


  # ==========================================================
  # 2. DETAILED HTTP REQUEST METRICS (FROM LOGS)
  # ==========================================================

  # Add "from logs"

  signal_to_metrics/detailed:
    error_mode: ignore

    logs:

      - name: app.http.requests
        description: Count HTTP requests by service, URL path and status code
        unit: "{request}"

        conditions:
          - 'log.attributes["http.response.status_code"] != nil and resource.attributes["service.name"] != nil'

        attributes:
          - key: url.path

          - key: http.response.status_code
          
          - key: app.metric_source
            default_value: logs

          - key: app.operation
            optional: true

        sum:
          value: "1"
          monotonic: true


  # ==========================================================
  # 3. HTTP TRACE-TO-METRICS CONVERSION
  # ==========================================================

  signal_to_metrics/traces:
    error_mode: ignore

    spans:

      - name: app.http.trace.requests
        description: Count HTTP requests by response status code and method
        unit: "{request}"

        conditions:
          - 'span.attributes["http.response.status_code"] != nil'

        attributes:
          - key: http.response.status_code
          
          - key: app.metric_source
            default_value: traces

          - key: http.request.method
            optional: true

        sum:
          value: "Int(AdjustedCount())"
          monotonic: true


# ============================================================
# SERVICE PIPELINES
# ============================================================

service:

  pipelines:

    # ========================================================
    # TRACES BEFORE SAMPLING
    #
    # Receives a copy of incoming traces.
    # Runs the common enrichment and redaction processors.
    # Does NOT execute tail_sampling.
    # ========================================================

    traces/before:
      receivers:
        - otlp

      processors:
        - resource_detection
        - memory_limiter
        - transform/sanitize_spans
        - gen_ai_normalizer
        - transform/redact_sensitive_data
        - redaction

      exporters:
        - elasticsearch/before


    # ========================================================
    # TRACES AFTER SAMPLING
    #
    # Existing trace pipeline.
    # Executes tail_sampling before exporting.
    # ========================================================

    traces:
      receivers:
        - otlp

      processors:
        - resource_detection
        - memory_limiter
        - transform/sanitize_spans
        - gen_ai_normalizer
        - transform/redact_sensitive_data
        - redaction
        - tail_sampling

      exporters:
        - debug
        - otlp_grpc/jaeger
        - span_metrics
        - signal_to_metrics/traces
        - elasticsearch
        - elasticsearch/after


    # ========================================================
    # ADAPTIVE SAMPLING TRACE PIPELINE
    # DISABLED FOR NOW
    #
    # Receives its own copy of incoming OTLP traces.
    # Uses the same preprocessing as the other trace pipelines.
    # Would execute adaptive_tail_sampling independently.
    # ========================================================

    # traces/adaptive:
    #   receivers:
    #     - otlp
    #
    #   processors:
    #     - resource_detection
    #     - memory_limiter
    #     - transform/sanitize_spans
    #     - gen_ai_normalizer
    #     - transform/redact_sensitive_data
    #     - redaction
    #     - adaptive_tail_sampling
    #
    #   exporters:
    #     - elasticsearch/adaptive


    # ========================================================
    # ORIGINAL METRICS PIPELINE
    # PROMETHEUS
    # ========================================================

    metrics:
      receivers:
        - docker_stats
        - http_check/frontend-proxy
        - host_metrics
        - nginx
        - otlp
        - redis
        - postgresql
        - prometheus/ad
        - span_metrics
        - signal_to_metrics/traces

      processors:
        - resource_detection
        - memory_limiter
        - transform/add_service_name_to_metrics

      exporters:
        - debug
        - otlp_http/prometheus


    # ========================================================
    # ORIGINAL METRICS PIPELINE
    # ELASTICSEARCH
    # ========================================================

    metrics/elasticsearch:
      receivers:
        - docker_stats
        - http_check/frontend-proxy
        - host_metrics
        - nginx
        - otlp
        - redis
        - postgresql
        - prometheus/ad
        - span_metrics
        - signal_to_metrics/traces

      processors:
        - resource_detection
        - memory_limiter
        # - cumulative_to_delta  # Disabled for testing
        - transform/add_service_name_to_metrics

      exporters:
        - elasticsearch


    # ========================================================
    # CUMULATIVE LOG-DERIVED METRICS
    # ========================================================

    metrics/log-derived:
      receivers:
        - signal_to_metrics/aggregate

      processors:
        - resource_detection
        - memory_limiter
        - deltatocumulative

      exporters:
        - debug
        - otlp_http/prometheus
        - elasticsearch


    # ========================================================
    # DETAILED LOG-DERIVED METRICS
    # ========================================================

    metrics/log-derived/detailed:
      receivers:
        - signal_to_metrics/detailed

      processors:
        - resource_detection
        - memory_limiter
        - transform/add_service_name_to_metrics

      exporters:
        - debug
        - otlp_http/prometheus
        - elasticsearch


    # ========================================================
    # LOGS PIPELINE
    # ========================================================

    logs:
      receivers:
        - otlp
        - postgresql

      processors:
        - resource_detection
        - memory_limiter
        - transform/sanitize_logs

      exporters:
        - debug
        - opensearch
        - elasticsearch
        - signal_to_metrics/aggregate
        - signal_to_metrics/detailed
